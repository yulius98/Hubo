name: hubo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hubo:latest
    restart: unless-stopped
    environment: &app-env
      APP_NAME: "${APP_NAME:-HUBO}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      APP_LOCALE: "${APP_LOCALE:-id}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-id}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hubo
      DB_USERNAME: hubo
      DB_PASSWORD: hubo_secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      LOG_STACK: single
      WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID:-}"
      WORKOS_API_KEY: "${WORKOS_API_KEY:-}"
      WORKOS_REDIRECT_URL: "${APP_URL:-http://localhost:8000}/authenticate"
    depends_on:
      db:
        condition: service_healthy
    networks: [hubo]

  queue:
    image: hubo:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    environment:
      <<: *app-env
      RUN_SETUP: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [hubo]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [hubo]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hubo
      POSTGRES_USER: hubo
      POSTGRES_PASSWORD: hubo_secret
    volumes:
      - hubo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubo -d hubo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hubo]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [hubo]

volumes:
  hubo_pgdata:

networks:
  hubo:
